function videoStep(t) {

}

// ── 宣伝の流れ（らら の台本 2026-11-09）：τ＝切り出しの頭からの秒

// ゲームの掛け声（はじまるよー！→3 2 1 GO!）を絵に描く。intro＝{at: 声の頭の τ, hd: はじまるよの長さ, gap, marks}。見た目は画面の .intro と同じ
function videoIntro(tau) {

// 第二弾の締め：outro＝[1行目, 2行目, ボタン]・ジャケットを3×2に並べる。pops＝[1行目, ジャケット, 2行目, ボタン] の出る秒
function videoOutro2(u) {

function videoFrame(t) {
